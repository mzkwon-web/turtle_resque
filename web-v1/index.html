<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제주 바다 파수꾼 v1</title><style>@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f6fbfd;color:#334155;font-family:'Nanum Gothic',sans-serif}header{background:linear-gradient(135deg,#0c4a6e,#075985);color:#fff;padding:22px 5vw;position:sticky;top:0;z-index:5}.logo{font:32px Jua}.wrap{max-width:1100px;margin:auto;padding:28px 5vw}.hero,.card{background:#fff;border:1px solid #dbeafe;border-radius:24px;padding:24px}.hero h1,h2{font-family:Jua;color:#0c4a6e}.hero h1{font-size:clamp(38px,6vw,64px);margin:10px 0}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#e0f2fe;color:#075985;border-radius:99px;padding:7px 11px;font-weight:800;font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0}.tabs button,.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.tabs button{background:#fff;color:#075985}.tabs button.on,.btn{background:#0c4a6e;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{min-height:180px}.card p{line-height:1.6}.game{margin-top:20px;background:#fff;border-radius:24px;padding:20px;display:none}.game.open{display:block}.gamegrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}canvas{width:100%;background:#78cbe5;border-radius:18px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{background:#e0f2fe;padding:8px 11px;border-radius:10px;font-weight:800}.controls{display:flex;gap:8px;justify-content:center}.controls button{border:0;border-radius:12px;padding:12px 18px;font-weight:800}.b{background:#f59e0b;color:#fff}@media(max-width:700px){.grid,.gamegrid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">🌊 제주 바다 파수꾼 · v1</div></header><main class="wrap"><section class="hero"><div class="badges"><span class="badge">초등 6학년</span><span class="badge">4차시 × 40분</span><span class="badge">환경 + SW</span></div><h1>설명하고,<br>바로 플레이해요.</h1><p>세계 환경의 날을 주제로 환경 문제를 이해하고 마이크로비트 구조 게임으로 연결하는 수업 진행용 웹앱입니다.</p><button class="btn" onclick="openGame()">🎮 제주 바다 파수꾼 게임 실행</button></section><div class="tabs"><button class="on" onclick="filter(0,this)">전체</button><button onclick="filter(1,this)">1차시</button><button onclick="filter(2,this)">2차시</button><button onclick="filter(3,this)">3차시</button><button onclick="filter(4,this)">4차시</button></div><section class="grid" id="grid"></section><section class="game" id="gamebox"><h2>🐢 거북이 구조 게임</h2><div class="gamegrid"><div><canvas id="cv" width="600" height="430"></canvas><div class="stats"><span class="stat">점수 <b id="score">0</b></span><span class="stat">구조 <b id="rescues">0</b></span><span class="stat">수온 <b id="temp">26</b>℃</span><span class="stat">B <b id="press">0/10</b></span></div><div class="controls"><button onpointerdown="keys.l=1" onpointerup="keys.l=0">◀</button><button class="b" onclick="rescue()">B 구조!</button><button onpointerdown="keys.r=1" onpointerup="keys.r=0">▶</button></div></div><div><h2>학생 미션</h2><p id="mission">쓰레기를 피하면 +1점. 충돌하면 1초 안에 B버튼 10번!</p><p>수온이 <b>28℃ 초과</b>하면 거북이가 느려집니다.</p><div class="controls"><button onclick="temp--">−1℃</button><button onclick="temp++">+1℃</button></div><p>키보드 ← → / B키도 사용할 수 있습니다.</p></div></div></section></main><script>const lessons=[['제주 바다의 환경 문제와 해양 쓰레기 알기','해양 쓰레기의 원인과 바다 생물에 미치는 영향을 알아봅니다.'],['마이크로비트로 바다거북 움직이기','5×5 LED, 가속도 센서, 좌우 이동, 떨어지는 쓰레기와 충돌 감지를 배웁니다.'],['제주 바다 파수꾼 구조 게임','변수와 조건문을 이용해 쓰레기를 피하고 B버튼 연타로 거북이를 구조합니다.'],['수온 상승 패널티 추가하기','온도 센서를 이해하고 수온이 높을 때 거북이가 느려지는 환경 모델을 만듭니다.']];function drawCards(n=0){grid.innerHTML=lessons.map((x,i)=>!n||n===i+1?`<article class="card"><div class="badge">${i+1}차시 · 40분</div><h2>${x[0]}</h2><p>${x[1]}</p>${i>0?'<button class="btn" onclick="openGame()">▶ 체험하기</button>':''}</article>`:'').join('')}function filter(n,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');drawCards(n)}drawCards();let ctx=cv.getContext('2d'),keys={l:0,r:0},t={x:300,y:370},o={x:160,y:-30},score=0,rescues=0,temp=26,hit=0,end=0,presses=0,last=0,raf;function openGame(){gamebox.classList.add('open');gamebox.scrollIntoView({behavior:'smooth'});reset()}function reset(){score=rescues=presses=0;temp=26;hit=0;t.x=300;o={x:30+Math.random()*540,y:-30};last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function rescue(){if(!hit)return;presses++;if(presses>=10){rescues++;score+=5;hit=0;presses=0;o.y=-40;mission.textContent='🎉 구조 성공! +5점'}}function loop(now){let d=Math.min(40,now-last);last=now,s=temp>28?.16:.38;if(keys.l)t.x-=s*d;if(keys.r)t.x+=s*d;t.x=Math.max(30,Math.min(570,t.x));if(!hit){o.y+=.17*d;if(o.y>420){score++;o={x:30+Math.random()*540,y:-30}}if(Math.abs(t.x-o.x)<40&&Math.abs(t.y-o.y)<40){hit=1;end=now+1000;presses=0;mission.textContent='🆘 지금 B버튼 10번!'}}else if(now>end){hit=0;o.y=-40;mission.textContent='😢 구조 실패. 다시 도전!'}ctx.fillStyle='#78cbe5';ctx.fillRect(0,0,600,430);ctx.textAlign='center';ctx.font='38px serif';ctx.fillText('🐢',t.x,t.y);ctx.fillText('🛍️',o.x,o.y);ctx.fillStyle='#075985';ctx.font='bold 18px sans-serif';ctx.fillText(temp>28?'🔥 수온 상승 — 이동 속도 감소':'🌊 제주 바다',300,28);document.getElementById('score').textContent=score;document.getElementById('rescues').textContent=rescues;document.getElementById('temp').textContent=temp;press.textContent=presses+'/10';raf=requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key.toLowerCase()==='b')rescue()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});</script></body></html>
