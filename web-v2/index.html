<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제주 바다 파수꾼 · PPT 기반 v2</title><style>@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap');:root{--n:#0C4A6E;--b:#075985;--g:#7ED957;--o:#FFB347}*{box-sizing:border-box}body{margin:0;background:#dfeff6;color:#334155;font-family:'Nanum Gothic',sans-serif}.top{height:70px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 3vw;position:sticky;top:0;z-index:5;border-bottom:1px solid #d6eaf3}.brand{font:26px Jua;color:var(--n);margin-right:auto}.top button,.nav button,.action{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.top button{background:#edf6fa;color:var(--b)}.deck{min-height:calc(100vh - 130px);display:flex;align-items:center;justify-content:center;padding:20px}.slide{width:min(1150px,100%);aspect-ratio:16/9;background:#f2fafe;border-radius:28px;box-shadow:0 24px 70px #0c4a6e33;position:relative;overflow:hidden}.inner{height:100%;padding:52px 60px;display:flex;flex-direction:column}.tag{background:var(--g);color:#fff;border-radius:99px;padding:8px 16px;font-weight:800;align-self:flex-start}.title{font:clamp(38px,5vw,68px)/1.12 Jua;color:var(--n);white-space:pre-line;margin:22px 0 12px}.body{font-size:clamp(17px,2vw,25px);line-height:1.6;white-space:pre-line}.actions{margin-top:auto;display:flex;gap:10px}.action{background:var(--n);color:#fff}.action.alt{background:#f59e0b}.no{position:absolute;right:30px;bottom:20px;color:#76a9c2;font-weight:800}.nav{display:flex;justify-content:center;gap:10px;padding-bottom:18px}.nav button{background:#fff;color:var(--n)}.modal{position:fixed;inset:0;background:#032f3ed9;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{width:min(950px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:10px;padding:10px}.ai{display:grid;grid-template-columns:1fr 1fr;gap:15px}.class{border:2px dashed #acd9eb;border-radius:20px;padding:25px;text-align:center;cursor:pointer}.icon{font-size:80px}.bar{height:13px;background:#dbeaf1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);width:0}.gamegrid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}canvas{width:100%;background:#78cbe5;border-radius:18px}.stats,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stats span{background:#edf8fd;border-radius:10px;padding:8px 11px;font-weight:800}.controls button{border:0;border-radius:11px;padding:11px 16px;font-weight:800}.rescue{background:var(--o)}@media(max-width:760px){.slide{aspect-ratio:auto;min-height:70vh}.inner{padding:34px 25px}.gamegrid,.ai{grid-template-columns:1fr}.top button:nth-of-type(-n+4){display:none}}</style></head><body><div class="top"><div class="brand">🌊 제주 바다 파수꾼 · PPT v2</div><button onclick="go(1)">도입</button><button onclick="go(28)">2차시</button><button onclick="go(48)">3차시 AI</button><button onclick="go(61)">4차시</button><b id="count"></b></div><main class="deck"><section class="slide"><div class="inner"><div class="tag" id="tag"></div><h1 class="title" id="title"></h1><div class="body" id="body"></div><div class="actions" id="actions"></div><div class="no" id="no"></div></div></section></main><div class="nav"><button onclick="prev()">← 이전</button><button onclick="next()">다음 →</button></div><div class="modal" id="aiModal"><div class="box"><div class="head"><h2>🤖 해파리와 비닐 AI 분류 체험</h2><button class="close" onclick="aiModal.classList.remove('open')">✕</button></div><p id="result">이미지를 눌러 AI 예측을 비교해 보세요.</p><div class="ai"><div class="class" onclick="classify(1)"><div class="icon">🪼</div><h2>해파리</h2><div class="bar"><i id="j"></i></div></div><div class="class" onclick="classify(0)"><div class="icon">🛍️</div><h2>비닐봉지</h2><div class="bar"><i id="p"></i></div></div></div><p>※ 실제 학습에서는 엔트리 이미지 학습 모델을 사용합니다.</p></div></div><div class="modal" id="gameModal"><div class="box"><div class="head"><h2>🐢 제주 바다거북 구조 게임</h2><button class="close" onclick="closeGame()">✕</button></div><div class="gamegrid"><div><canvas id="cv" width="600" height="430"></canvas><div class="stats"><span>점수 <b id="score">0</b></span><span>구조 <b id="rescues">0</b></span><span>수온 <b id="temp">30</b>℃</span><span>B <b id="press">0/10</b></span></div><div class="controls"><button onpointerdown="keys.l=1" onpointerup="keys.l=0">◀</button><button class="rescue" onclick="rescue()">B 구조!</button><button onpointerdown="keys.r=1" onpointerup="keys.r=0">▶</button></div></div><div><h2>미션</h2><p id="mission">쓰레기와 충돌하면 <b>2초 안에 B버튼 10회</b>로 구조하세요.</p><p>PPT 기준: <b>33℃ 초과</b> 시 거북이 이동 속도가 느려집니다.</p><div class="controls"><button onclick="temp--">−1℃</button><button onclick="temp++">+1℃</button></div></div></div></div></div><script>const data=[['마이크로비트로 만드는\n제주 바다 파수꾼 - 거북이를 구하라','제주 바다 지킴이가 되어봅시다'],['퀴-즈','바다거북이가 가장 좋아하는 먹이는 무엇일까요?'],['세계 환경의 날','6월 5일, 지구 환경을 생각하고 행동하는 날'],['거북이의 눈이 되어 보세요','해파리와 투명 비닐봉지는 바닷속에서 비슷하게 보일 수 있어요.'],['제주 바다','아름다운 제주 바다와 해양 생물을 만나봅니다.'],['오늘의 학습 목표','환경 문제를 이해하고 마이크로비트와 AI를 활용해 제주 바다 파수꾼을 만들어 봅니다.'],['우리반 약속','바른 자세 · 집중하기 · 모르면 손들기 · 친구 도와주기'],['1차시','제주 바다의 환경 문제와 해양 쓰레기를 알아봅니다.'],['해양 쓰레기','육지와 바다에서 발생한 쓰레기가 해양 생물에게 어떤 영향을 주는지 탐구합니다.'],['바다 쓰레기는 어디서 왔을까?','육지 유입 쓰레기와 폐어구를 살펴봅니다.'],['미세플라스틱','작아진 플라스틱이 먹이사슬을 따라 우리에게 돌아올 수 있습니다.'],['제주 바다 파수꾼','환경 문제를 코딩과 피지컬 컴퓨팅으로 연결합니다.'],['마이크로비트','5×5 LED, 버튼, 가속도 센서, 온도 기능을 사용합니다.'],['MakeCode','마이크로비트를 연결하고 코드를 다운로드합니다.'],['5×5 LED','X와 Y 위치를 이용해 화면 속 캐릭터를 움직입니다.'],['가속도 센서','마이크로비트를 왼쪽·오른쪽으로 기울인 값을 이용합니다.'],['거북이 움직이기','기울기에 따라 바다거북의 X 위치를 바꿉니다.'],['피지컬 컴퓨팅','센서로 현실의 움직임을 입력하고 프로그램 결과를 출력합니다.'],['마이크로비트 연결','USB로 연결하고 Pair device를 선택합니다.'],['수업 도구','bit.ly/26_제주바다파수꾼'],['수업 도구 확인','마이크로비트와 브라우저를 준비합니다.'],['코딩 시작','거북이 스프라이트를 만들고 움직여 봅니다.'],['쓰레기 만들기','위에서 아래로 떨어지는 쓰레기 스프라이트를 만듭니다.'],['충돌 감지','거북이와 쓰레기가 닿았는지 확인합니다.'],['경고','충돌하면 LED와 소리로 위험을 알립니다.'],['디버깅','움직임·쓰레기·충돌 조건을 차례로 확인합니다.'],['퀴즈','센서와 움직임의 관계를 확인합니다.'],['2차시','거북이를 움직이고 쓰레기를 감지해 구조 게임을 만듭니다.'],['오늘의 학습 목표','변수와 조건을 사용해 구조 미션을 완성합니다.'],['점수','쓰레기를 피하면 점수가 올라갑니다.'],['변수','점수와 B버튼을 누른 횟수를 기억합니다.'],['구조 미션','쓰레기와 충돌하면 구조 미션이 시작됩니다.'],['B버튼','2초 안에 B버튼을 10번 눌러 거북이를 구조합니다.'],['조건문','연타 횟수가 10 이상인지 판단합니다.'],['알고리즘','입력 → 판단 → 결과의 순서로 게임이 작동합니다.'],['게임 테스트','직접 플레이하며 오류를 찾아 수정합니다.'],['난이도 조절','시간과 연타 횟수를 바꾸며 게임을 조절할 수 있습니다.'],['전체 코드 점검','변수·조건·센서·버튼을 확인합니다.'],['제주 바다 구조 게임','실제 게임으로 구조 미션을 체험합니다.'],['쓰레기 피하기','좌우로 움직여 쓰레기를 피하세요.'],['충돌!','2초 안에 B버튼 10번!'],['구조 성공','조건을 만족하면 거북이 구조에 성공합니다.'],['구조 실패','시간 안에 성공하지 못하면 다시 도전합니다.'],['변수란?','변하는 값을 기억하는 상자입니다.'],['조건문','만약 ~라면, 조건에 따라 다른 결과를 실행합니다.'],['디버깅','왜 작동하지 않는지 원인을 찾아 해결합니다.'],['3차시','AI 이미지 모델로 해파리와 비닐을 구분합니다.'],['AI 이미지 학습','이미지를 모아 해파리와 비닐 클래스를 학습합니다.'],['오늘의 학습 목표','AI가 이미지를 분류하는 원리를 체험합니다.'],['엔트리 AI','이미지 학습 모델을 만들고 분류 결과를 확인합니다.'],['학습 데이터','해파리와 비닐 이미지를 각각 학습시킵니다.'],['AI 분류','새 이미지를 보고 해파리인지 비닐인지 예측합니다.'],['AI도 틀릴 수 있어요','학습 데이터와 이미지에 따라 오분류가 생길 수 있습니다.'],['분류 결과 연결','비닐이면 위험 신호를 주도록 게임과 연결합니다.'],['AI + 마이크로비트','AI의 판단을 피지컬 컴퓨팅 활동으로 확장합니다.'],['통합 미션','AI 분류와 구조 게임을 함께 체험합니다.'],['테스트','여러 이미지를 넣어 예측 결과를 비교합니다.'],['오류 찾기','AI가 틀린 이유를 생각하고 학습 데이터를 개선합니다.'],['3차시 정리','AI는 데이터를 바탕으로 분류하고 판단합니다.'],['퀴즈','AI 이미지 모델의 특징을 확인합니다.'],['4차시','제주 바다의 수온 변화를 게임에 반영합니다.'],['온도 감지','마이크로비트 온도값을 읽습니다.'],['수온 패널티','33℃보다 높으면 거북이가 느려지게 만듭니다.'],['환경 모델링','현실의 환경 변화를 게임 규칙으로 표현합니다.'],['전체 프로그램','이동 + 쓰레기 + 구조 + AI + 수온을 연결합니다.'],['오늘 우리가 배운 것들','환경 문제와 기술을 연결해 해결 방법을 만들어 보았습니다.'],['OX 퀴즈','센서·AI·조건문 개념을 확인합니다.'],['OX 퀴즈','마이크로비트와 AI의 역할을 구분해 봅니다.'],['OX 퀴즈','환경 문제 해결에서 우리의 행동도 중요합니다.'],['세계 환경의 날','게임 속 구조를 현실의 환경 실천으로 연결합니다.'],['마무리','지구를 지키는 작은 실천, 제주 바다에서 시작됩니다!']];while(data.length<71)data.splice(data.length-1,0,['제주 바다 파수꾼','환경 + SW + AI 융합 활동']);let cur=1;function label(n){return n<28?'1차시 · 환경과 마이크로비트':n<48?'2차시 · 구조 게임':n<61?'3차시 · AI 이미지 분류':n<66?'4차시 · 수온 감지':'정리'}function render(){let d=data[cur-1];tag.textContent=label(cur);title.textContent=d[0];body.textContent=d[1];count.textContent=cur+'/71';no.textContent=cur+' / 71';actions.innerHTML='';if(cur>=39&&cur<=46||cur>=61&&cur<=65)actions.innerHTML+='<button class="action alt" onclick="openGame()">🎮 게임 실행</button>';if(cur>=48&&cur<=60)actions.innerHTML+='<button class="action" onclick="aiModal.classList.add(\'open\')">🤖 AI 분류 체험</button>'}function next(){if(cur<71){cur++;render()}}function prev(){if(cur>1){cur--;render()}}function go(n){cur=n;render()}function classify(jelly){let a=jelly?88:34;j.style.width=a+'%';p.style.width=(100-a)+'%';result.textContent=`AI 예측: 해파리 ${a}% · 비닐 ${100-a}% — AI도 학습 데이터에 따라 틀릴 수 있어요.`}let ctx=cv.getContext('2d'),keys={l:0,r:0},t={x:300,y:370},o={x:160,y:-30},score=0,rescues=0,temp=30,hit=0,end=0,presses=0,last=0,raf;function openGame(){gameModal.classList.add('open');reset()}function closeGame(){gameModal.classList.remove('open');cancelAnimationFrame(raf)}function reset(){score=rescues=presses=0;temp=30;hit=0;t.x=300;o={x:30+Math.random()*540,y:-30};last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function rescue(){if(!hit)return;presses++;if(presses>=10){rescues++;score+=5;hit=0;presses=0;o.y=-40;mission.textContent='🎉 구조 성공! +5점'}}function loop(now){let d=Math.min(40,now-last);last=now,s=temp>33?.15:.35;if(keys.l)t.x-=s*d;if(keys.r)t.x+=s*d;t.x=Math.max(30,Math.min(570,t.x));if(!hit){o.y+=.16*d;if(o.y>420){score++;o={x:30+Math.random()*540,y:-30}}if(Math.abs(t.x-o.x)<40&&Math.abs(t.y-o.y)<40){hit=1;end=now+2000;presses=0;mission.textContent='🆘 2초 안에 B버튼 10번!'}}else if(now>end){hit=0;o.y=-40;mission.textContent='😢 구조 실패. 다시 도전!'}ctx.fillStyle='#78cbe5';ctx.fillRect(0,0,600,430);ctx.textAlign='center';ctx.font='38px serif';ctx.fillText('🐢',t.x,t.y);ctx.fillText('🛍️',o.x,o.y);ctx.fillStyle='#075985';ctx.font='bold 18px sans-serif';ctx.fillText(temp>33?'🔥 33℃ 초과 — 거북이가 느려졌어요':'🌊 제주 바다',300,28);document.getElementById('score').textContent=score;document.getElementById('rescues').textContent=rescues;document.getElementById('temp').textContent=temp;press.textContent=presses+'/10';raf=requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!gameModal.classList.contains('open'))next();if(e.key==='ArrowLeft'&&!gameModal.classList.contains('open'))prev();if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key.toLowerCase()==='b')rescue()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});render();</script></body></html>
